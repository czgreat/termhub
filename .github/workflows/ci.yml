# Unit tests on every push and pull request. The Windows end-to-end tests
# (test/e2e: Playwright plus real ConPTY sessions) are left to local runs.
name: ci
on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: npm ci && npm run check && npm run test:unit && npm run build
        working-directory: web
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: go vet ./...
      - run: go build ./cmd/... ./tools/...
      - run: go test ./internal/agent/... ./internal/proto/...
